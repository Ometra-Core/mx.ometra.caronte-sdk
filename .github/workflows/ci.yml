name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            symfony: '7'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
            symfony: '7'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
            symfony: '8'
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'
            symfony: '8'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, openssl, curl, json, tokenizer, xml
          coverage: none

      - name: Validate Composer files
        run: composer validate --no-check-publish --no-check-lock

      - name: Select framework compatibility set
        run: |
          composer require --no-update "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}"
          if [ "${{ matrix.symfony }}" = "8" ]; then
            composer require --no-update "symfony/console:^8.0" "symfony/http-foundation:^8.0" "symfony/http-kernel:^8.0"
          fi

      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Restore package manifest after matrix resolution
        run: git restore composer.json

      - name: Run PHPUnit
        run: composer test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck
